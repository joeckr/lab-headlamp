services:
  headlamp:
    container_name: lab-headlamp
    image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "4466:4466"
    command:
      - "-plugins-dir=/headlamp/plugins"
    tmpfs:
      - /tmp
      - /home/headlamp/.config
    volumes:
      - headlamp-plugins:/headlamp/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4466/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  headlamp-plugins:
    driver: local
