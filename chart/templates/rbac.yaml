{{- if .Values.rbac.serviceAccountBinding.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lab-headlamp.name" . }}-sa
  labels:
    {{- include "lab-headlamp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.serviceAccountBinding.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "lab-headlamp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.rbac.oidcBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}
  labels:
    {{- include "lab-headlamp.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRoleName }}
subjects:
  {{- range .subjects }}
  - apiGroup: rbac.authorization.k8s.io
    kind: {{ .kind }}
    name: {{ .name | quote }}
  {{- end }}
{{- end }}
