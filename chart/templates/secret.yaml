{{- if and .Values.oidc.enabled .Values.oidc.secretCreate (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab-headlamp.oidcSecretName" . }}
  labels:
    {{- include "lab-headlamp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.secretKeys.clientID }}: {{ .Values.oidc.clientID | default "" | quote }}
  {{- if .Values.oidc.clientSecret }}
  {{ .Values.oidc.secretKeys.clientSecret }}: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
