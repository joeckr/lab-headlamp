[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, configure repo settings, and prepare environment"
depends = ["repo-settings"]
run = """
hk install --mise
"""

[tasks.repo-settings]
description = "Configure GitHub repository settings (delete merged branches, enable auto-merge)"
run = """
if command -v gh >/dev/null 2>&1 && git remote get-url origin >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
  gh repo edit --delete-branch-on-merge --enable-auto-merge || true
fi
"""

[tasks.compose]
description = "Run Podman Compose for local Headlamp testing"
run = """
podman compose up -d
"""

[tasks.down]
description = "Stop Podman Compose"
run = """
podman compose down
"""

[tasks.play]
description = "Run Podman Play for local helm chart testing"
depends = ["helm-t"]
run = """
podman play kube rendered.yaml --publish-all
"""

[tasks.play-d]
description = "Stop Podman Play local helm chart deployment"
depends = ["helm-d"]
run = """
podman play kube rendered.yaml --down
"""

[tasks.logs]
description = "View Podman Compose logs"
run = """
podman compose logs -f
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-l]
description = "Lint Helm chart"
depends = ["helm-d"]
run = """
helm lint chart/
"""

[tasks.helm-t]
description = "Render Helm chart templates"
depends = ["helm-d"]
run = """
helm template lab-headlamp chart/ > rendered.yaml
"""

[tasks.helm-i]
description = "Install or upgrade Headlamp Helm chart (pass OIDC values via -f values.local.yaml or --set)"
depends = ["helm-d"]
run = """
helm upgrade --install lab-headlamp chart/ --namespace headlamp --create-namespace
"""

[tasks.helm-u]
description = "Uninstall Headlamp Helm chart"
run = """
helm uninstall lab-headlamp --namespace headlamp
"""

[tasks.helm-d]
description = "Build Helm chart dependencies"
run = """
helm dependency build chart/
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
